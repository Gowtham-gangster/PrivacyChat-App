services:
  # Primary Database (Local development fallback if not using Supabase PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: privychat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-privychat}
      POSTGRES_USER: ${POSTGRES_USER:-privychat_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword123!}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-privychat_admin} -d ${POSTGRES_DB:-privychat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Coturn STUN/TURN Server for WebRTC NAT Traversal
  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: privychat-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    network_mode: "host"

  # PrivyChat Backend API Service (Integrated with Supabase Storage & PostgreSQL)
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: privychat-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/privychat}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-privychat_admin}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-ChangeMeSecurePassword123!}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      STORAGE_TYPE: ${STORAGE_TYPE:-supabase}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_BUCKET_NAME: ${SUPABASE_BUCKET_NAME:-privychat-attachments}
      SUPABASE_SIGNED_URL_EXPIRATION: ${SUPABASE_SIGNED_URL_EXPIRATION:-300}
      STORAGE_LOCAL_DIRECTORY: /app/storage
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-noreply@privychat.app}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-secret}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-/app/secrets/fcm-service-account.json}
      STUN_SERVER_URL: ${STUN_SERVER_URL:-stun:stun.l.google.com:19302}
      COTURN_ENABLED: ${COTURN_ENABLED:-false}
      COTURN_HOST: ${COTURN_HOST:-}
      COTURN_PORT: ${COTURN_PORT:-3478}
      COTURN_TLS_PORT: ${COTURN_TLS_PORT:-5349}
      COTURN_REALM: ${COTURN_REALM:-privychat.app}
      COTURN_STATIC_SECRET: ${COTURN_STATIC_SECRET:-e8c46231d5b84937a1e05d2c479bf6318e472095f9c4125b3a0e678912cf34ad}
      COTURN_TTL_SECONDS: ${COTURN_TTL_SECONDS:-86400}
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage

  # Reverse Proxy & APK Distribution Web Server
  nginx:
    image: nginx:1.26-alpine
    container_name: privychat-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../distribution:/usr/share/nginx/html/download:ro
      - certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  backend_storage:
  certs:
