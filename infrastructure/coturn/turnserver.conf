# =============================================================================
# PrivyChat Coturn TURN/STUN Configuration
# RFC 5766, RFC 5389, RFC 6156, RFC 6062
# =============================================================================

# Standard STUN/TURN listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Domain realm and server identification
realm=privychat.app
server-name=turn.privychat.app

# Ephemeral Authentication (RFC 5766 TURN REST API)
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=e8c46231d5b84937a1e05d2c479bf6318e472095f9c4125b3a0e678912cf34ad

# Relay UDP Port Range (Allocated for media relay sessions)
min-port=49152
max-port=49200

# Public IP / NAT Address Mapping:
# IMPORTANT: When deploying Coturn behind NAT (AWS EC2, GCP, Azure, DigitalOcean),
# uncomment and set external-ip to your public IP.
# If behind 1:1 NAT, format is: external-ip=<PUBLIC_IP>/<PRIVATE_IP>
# e.g.: external-ip=203.0.113.10/10.0.1.5
# external-ip=YOUR_SERVER_PUBLIC_IP

# Security Hardening: Block private IP reflection & loopback attacks
no-multicast-peers
no-cli
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# TLS Certificate & Private Key (For secure TURNS port 5349 over TLS)
# cert=/etc/coturn/certs/turn_server_cert.pem
# pkey=/etc/coturn/certs/turn_server_pkey.pem

# Logging
log-file=stdout
simple-log
verbose
