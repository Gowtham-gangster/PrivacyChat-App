# PrivyChat Coturn TURN/STUN Configuration
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

realm=privychat.app
server-name=turn.privychat.app

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=ChangeMeSecureCoturnSecretToken2026!

min-port=49152
max-port=49200

# Security hardening
no-multicast-peers
no-cli
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Logging
log-file=stdout
simple-log
verbose

