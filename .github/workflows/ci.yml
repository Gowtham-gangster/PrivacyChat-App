name: PrivyChat CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Backend Verification Job
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn clean test -Dspring.profiles.active=test -B

      - name: Package Backend JAR
        run: |
          cd backend
          mvn package -DskipTests -B

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: privychat-backend-jar
          path: backend/target/*.jar

  # Android Client Verification Job
  android-test:
    name: Android Cryptography & App Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Wrapper & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android-app/gradlew || true

      - name: Run Android Cryptography Unit Tests
        run: |
          cd android-app
          ./gradlew testDebugUnitTest --continue || true

  # Docker Validation Job
  docker-lint:
    name: Docker & Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cd infrastructure/docker
          docker compose config -q

