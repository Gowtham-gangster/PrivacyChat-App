spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:privychattest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 2525
privychat:
  storage:
    type: local
    local-dir: ./target/test-storage

