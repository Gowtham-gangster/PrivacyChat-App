spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:5000}
  address: 0.0.0.0
  shutdown: graceful

privychat:
  jwt:
    secret: ${JWT_SECRET:${SUPABASE_JWT_SECRET}}
  storage:
    type: ${STORAGE_TYPE:supabase}
    supabase:
      url: ${SUPABASE_URL}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
      bucket-name: ${SUPABASE_BUCKET_NAME:privychat-attachments}
      signed-url-expiration: ${SUPABASE_SIGNED_URL_EXPIRATION:300}
  mail:
    from-address: ${PRIVYCHAT_MAIL_FROM:${MAIL_FROM_ADDRESS:${SPRING_MAIL_USERNAME:${SMTP_USERNAME}}}}
    from-name: ${PRIVYCHAT_MAIL_FROM_NAME:${MAIL_FROM_NAME:PrivyChat Security}}

