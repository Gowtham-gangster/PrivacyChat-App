spring:
  application:
    name: privychat-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 20s

  mail:
    host: ${SPRING_MAIL_HOST:${SMTP_HOST:smtp.mailtrap.io}}
    port: ${SPRING_MAIL_PORT:${SMTP_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${SMTP_USERNAME:user}}
    password: ${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:pass}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${SMTP_AUTH:true}}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${SMTP_STARTTLS_ENABLE:true}}

server:
  port: ${PORT:${SERVER_PORT:5000}}
  address: 0.0.0.0
  shutdown: graceful
  servlet:
    context-path: /

privychat:
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  apk-download-url: ${APK_DOWNLOAD_URL:https://privychat.example.com/download/privychat-release.apk}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:${SUPABASE_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    access-expiration-minutes: 15
    refresh-expiration-days: 30
    issuer: ${AUTH_ISSUER:https://privychat.example.com}
  storage:
    type: ${STORAGE_TYPE:supabase} # supabase or local
    local-dir: ${STORAGE_LOCAL_DIR:./storage-attachments}
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket-name: ${SUPABASE_BUCKET_NAME:privychat-attachments}
      signed-url-expiration: ${SUPABASE_SIGNED_URL_EXPIRATION:300}
  mail:
    from-address: ${PRIVYCHAT_MAIL_FROM:${MAIL_FROM_ADDRESS:${SPRING_MAIL_USERNAME:${SMTP_USERNAME:noreply@privychat.example.com}}}}
    from-name: ${PRIVYCHAT_MAIL_FROM_NAME:${MAIL_FROM_NAME:PrivyChat Security}}
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:privychat}
    credentials-path: ${FCM_CREDENTIALS_PATH:/etc/privychat/firebase.json}
  webrtc:
    stun-server: ${STUN_SERVER_URL:${STUN_SERVER:stun:stun.l.google.com:19302}}
    coturn:
      enabled: ${COTURN_ENABLED:false}
      host: ${COTURN_HOST:}
      port: ${COTURN_PORT:3478}
      tls-port: ${COTURN_TLS_PORT:5349}
      static-secret: ${COTURN_STATIC_SECRET:}
      realm: ${COTURN_REALM:privychat.app}
      ttl-seconds: ${COTURN_TTL_SECONDS:86400}
    turn-server: ${TURN_SERVER_URL:${TURN_SERVER:}}
    turn-username: ${TURN_SERVER_USERNAME:${TURN_USERNAME:}}
    turn-secret: ${TURN_SERVER_CREDENTIAL:${TURN_PASSWORD:}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

